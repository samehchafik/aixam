[package]
name = "borne"
version = "0.1.0"
edition = "2021"
description = "Une page web en plein ecran, sans bord, toujours au premier plan, sur l'ecran choisi."
default-run = "borne"

[[bin]]
name = "borne"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Pour savoir si le clavier tactile de Windows est a l'ecran (IFrameworkInputPane,
# par COM) : tant qu'il l'est, la fenetre laisse le premier plan et le focus.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
