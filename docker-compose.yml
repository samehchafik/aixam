services:
  # La base en conteneur. Sous profil : elle ne demarre que si .env contient
  # COMPOSE_PROFILES=container-db, ce qui est le cas par defaut. Sur un
  # serveur qui a deja son PostgreSQL, on retire cette ligne du .env et on
  # renseigne DATABASE_URL -- voir deploy/README.md. Rien d'autre a faire :
  # `docker compose up -d` fait alors ce qu'il faut, sans option.
  db:
    image: postgres:16-alpine
    profiles: ["container-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aixam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aixam}
      POSTGRES_DB: ${POSTGRES_DB:-aixam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aixam} -d ${POSTGRES_DB:-aixam}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      # DATABASE_URL du .env l'emporte : c'est ce qui permet de pointer sur le
      # PostgreSQL de l'hote. Sans lui, on vise le service db ci-dessus.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-aixam}:${POSTGRES_PASSWORD:-aixam}@db:5432/${POSTGRES_DB:-aixam}}
    # Rend l'hote joignable depuis le conteneur sous le nom
    # host.docker.internal, y compris sous Linux. Sans effet tant qu'on ne
    # l'utilise pas.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        # Base hors profil (PostgreSQL de la machine) : on demarre sans elle.
        required: false
    ports:
      # Derriere un reverse proxy, mettre API_BIND=127.0.0.1 dans .env : sans
      # ca l'API reste joignable en direct sur le port 8080, donc en clair et
      # sans passer par nginx. Le defaut reste ouvert car sur le stand la
      # borne joint l'API par le reseau local.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8080}:8000"
    volumes:
      - media:/app/media
      - ./apps/api/static:/app/static:ro

  # Worker d'envoi des emails (file outbox). Separe de l'API pour qu'une panne
  # SMTP n'impacte jamais la borne.
  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-aixam}:${POSTGRES_PASSWORD:-aixam}@db:5432/${POSTGRES_DB:-aixam}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        required: false
    command: ["python", "-m", "app.workers.outbox"]
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:

# Sous-reseau fige. Sans lui, docker choisit une plage libre a la creation du
# reseau et la passerelle change d'une machine a l'autre, voire d'un `compose
# down` au suivant. Or c'est par cette passerelle que le conteneur joint un
# PostgreSQL installe sur l'hote : elle doit etre connue pour figurer dans
# listen_addresses et pg_hba.conf.
#
# Si la plage est deja prise sur la machine (docker refuse alors le reseau
# avec « Pool overlaps with other one on this address space »), en choisir
# une autre via DOCKER_SUBNET dans .env.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}
