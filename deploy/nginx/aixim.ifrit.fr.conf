# aixim.ifrit.fr -- la borne (front).
#
# L'API sert la borne sous /kiosk/ et le back-office a la racine. Ce vhost
# remet donc la borne a la racine de SON domaine, et laisse passer /api, /ws
# et /media tels quels : la borne les appelle en relatif des lors que
# apiBaseUrl est vide dans config.json (voir deploy/README.md).
#
# Volontairement en HTTP seul : c'est `certbot --nginx` qui ajoutera le bloc
# 443, le certificat et la redirection. Ce fichier est donc l'etat AVANT
# certbot ; apres, la copie dans /etc/nginx aura diverge, c'est normal.
#
#   /etc/nginx/sites-available/aixim.ifrit.fr

upstream aixam_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aixim.ifrit.fr;

    access_log /var/log/nginx/aixim.access.log;
    error_log  /var/log/nginx/aixim.error.log;

    # La creation part en piece jointe base64 vers /api/relay/send : jusqu'a
    # 8 Mio, que le defaut de nginx (1 Mo) refuserait en 413.
    client_max_body_size 16m;

    # Le bundle de la borne fait ~840 Ko : la compression change la premiere
    # ouverture sur une connexion de salon.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    # --- L'API, telle quelle ---
    location /api/ {
        include proxy_params;
        proxy_pass http://aixam_api;
    }

    location /media/ {
        include proxy_params;
        proxy_pass http://aixam_api;
    }

    location = /healthz {
        include proxy_params;
        proxy_pass http://aixam_api;
        access_log off;
    }

    # --- La synchronisation des deux ecrans ---
    # Sans ces en-tetes, la negociation WebSocket echoue ; sans le timeout
    # long, nginx coupe un canal inactif au bout de 60 s et le grand ecran
    # se fige entre deux visiteurs.
    location /ws/ {
        include proxy_params;
        proxy_pass http://aixam_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- La borne, remontee a la racine ---
    # La barre oblique finale de proxy_pass fait la substitution : / devient
    # /kiosk/, /assets/x.js devient /kiosk/assets/x.js. Le bundle est compile
    # avec `base: './'`, donc il fonctionne a n'importe quelle profondeur.
    location / {
        include proxy_params;
        proxy_pass http://aixam_api/kiosk/;
    }
}
