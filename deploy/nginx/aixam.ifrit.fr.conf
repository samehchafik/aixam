# aixam.ifrit.fr -- la borne (front).
#
# Un proxy vers l'API sur le 8080, avec UNE particularite : l'API sert la
# borne sous /kiosk/ et le back-office a sa racine. Ce vhost remet donc la
# borne a la racine de son domaine -- d'ou deux location au lieu d'une.
#
#   location /                    ->  http://127.0.0.1:8080/kiosk/
#   location /api, /ws, /media    ->  http://127.0.0.1:8080   (tel quel)
#
# Sans cette separation, /api/kiosk/register partirait vers
# /kiosk/api/kiosk/register et plus rien ne repondrait.
#
# En HTTP seul : `certbot --nginx` ajoutera le bloc 443 et la redirection.
#
#   /etc/nginx/sites-available/aixam.ifrit.fr

# La synchronisation des deux ecrans passe par un WebSocket (/ws/screens).
# Cette table dit a nginx de ne demander l'upgrade que pour les requetes qui
# le demandent, et de fermer proprement les autres.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name aixam.ifrit.fr;

    access_log /var/log/nginx/aixam.access.log;
    error_log  /var/log/nginx/aixam.error.log;

    # La creation part en piece jointe base64 vers /api/relay/send : jusqu'a
    # 8 Mio, que le defaut de nginx (1 Mo) refuserait en 413.
    client_max_body_size 16m;

    # Reglages communs aux deux location : declares ici, ils sont herites.
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Sans ce timeout, nginx coupe un WebSocket inactif au bout de 60 s et le
    # grand ecran se fige entre deux visiteurs.
    proxy_read_timeout 3600s;

    # Ce que l'API sert a sa racine : on ne touche pas au chemin.
    location ~ ^/(api|ws|media|healthz) {
        proxy_pass http://127.0.0.1:8080;
    }

    # Tout le reste, c'est la borne. La barre oblique finale fait la
    # substitution : / devient /kiosk/, /assets/x.js devient
    # /kiosk/assets/x.js. Le bundle est compile avec `base: './'`, donc il
    # fonctionne a n'importe quelle profondeur.
    location / {
        proxy_pass http://127.0.0.1:8080/kiosk/;
    }
}
