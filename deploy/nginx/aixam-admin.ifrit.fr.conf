# aixam-admin.ifrit.fr -- le back-office.
#
# Un proxy simple vers l'API sur le 8080. L'API sert deja le back-office a sa
# racine : il n'y a rien a reecrire, tout passe tel quel.
#
# En HTTP seul : `certbot --nginx` ajoutera le bloc 443 et la redirection.
#
#   /etc/nginx/sites-available/aixam-admin.ifrit.fr

server {
    listen 80;
    listen [::]:80;
    server_name aixam-admin.ifrit.fr;

    access_log /var/log/nginx/aixam-admin.access.log;
    error_log  /var/log/nginx/aixam-admin.error.log;

    # /api/relay/send recoit la creation en piece jointe base64, jusqu'a
    # 8 Mio. Le defaut de nginx, 1 Mo, la refuserait en 413.
    client_max_body_size 16m;

    # La borne n'a rien a faire sur le domaine du back-office.
    location /kiosk {
        return 404;
    }

    # Durcissement facultatif : n'ouvrir le back-office qu'a vos adresses.
    # allow 203.0.113.4;
    # deny all;

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8080;
    }
}
