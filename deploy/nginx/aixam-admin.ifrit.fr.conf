# aixam-admin.ifrit.fr -- le back-office.
#
# L'API sert deja le back-office a la racine : ce vhost n'a rien a reecrire.
#
# Volontairement en HTTP seul : `certbot --nginx` ajoutera le bloc 443 et la
# redirection. Voir deploy/README.md.
#
#   /etc/nginx/sites-available/aixam-admin.ifrit.fr
#
# L'upstream aixam_api est declare dans aixam.ifrit.fr.conf : les deux vhosts
# le partagent, ne le declarez pas deux fois.

server {
    listen 80;
    listen [::]:80;
    server_name aixam-admin.ifrit.fr;

    access_log /var/log/nginx/aixam-admin.access.log;
    error_log  /var/log/nginx/aixam-admin.error.log;

    # L'admin declenche des envois relayes et lit des exports : meme plafond
    # que sur l'autre vhost, pour la meme raison.
    client_max_body_size 16m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    # La borne n'a rien a faire sur le domaine du back-office : deux entrees
    # pour deux publics, et une surface de moins a proteger ici.
    location /kiosk {
        return 404;
    }

    # Durcissement facultatif : n'ouvrir le back-office qu'a vos adresses.
    # Decommenter et remplacer par les votres.
    #
    # allow 203.0.113.4;
    # deny all;

    location / {
        include proxy_params;
        proxy_pass http://aixam_api;
    }
}
